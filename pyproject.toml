[project]
name = "procurement-agent"
version = "0.1.0"
description = "Agentic AI workflow for procurement requests, with human approval, hallucination checks and evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.27",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pypdf>=7.0.0",
    "python-docx>=1.2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
